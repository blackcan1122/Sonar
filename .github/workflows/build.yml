name: Windows SDK
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        compiler: [msvc, mingw]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: matrix.compiler == 'mingw'
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-ninja
      - name: Configure
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          if ('${{ matrix.compiler }}' -eq 'msvc') {
            cmake -S . -B out/ci -G "Visual Studio 17 2022" -A x64
          } else {
            $env:PATH = "$env:MSYS2_LOCATION/ucrt64/bin;$env:PATH"
            Add-Content $env:GITHUB_PATH "$env:MSYS2_LOCATION/ucrt64/bin"
            cmake -S . -B out/ci -G Ninja -DCMAKE_C_COMPILER="$env:MSYS2_LOCATION/ucrt64/bin/gcc.exe" -DCMAKE_CXX_COMPILER="$env:MSYS2_LOCATION/ucrt64/bin/g++.exe" -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          }
      - name: Build and test
        run: |
          cmake --build out/ci --config ${{ matrix.configuration }} --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir out/ci -C ${{ matrix.configuration }} --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install out/ci --config ${{ matrix.configuration }} --prefix dist/sdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build installed consumer
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:PATH = "${{ github.workspace }}/dist/sdk/bin;$env:PATH"
          $options = @()
          if ('${{ matrix.compiler }}' -eq 'mingw') { $options = @('-G', 'Ninja', "-DCMAKE_CXX_COMPILER=$env:MSYS2_LOCATION/ucrt64/bin/g++.exe") }
          else { $options = @('-G', 'Visual Studio 17 2022', '-A', 'x64') }
          cmake -S dist/sdk/examples/sdk-consumer -B out/consumer -DCMAKE_PREFIX_PATH="${{ github.workspace }}/dist/sdk" -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} @options
          cmake --build out/consumer --config ${{ matrix.configuration }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir out/consumer -C ${{ matrix.configuration }} --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-windows-${{ matrix.compiler }}-${{ matrix.configuration }}
          path: dist/sdk

name: Premake Windows CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Download and Install Premake5 for Windows
      - name: Install Premake5
        run: |
          curl -LO https://github.com/premake/premake-core/releases/download/v5.0.0-alpha16/premake-5.0.0-alpha16-windows.zip
          tar -xf premake-5.0.0-alpha16-windows.zip
          move premake5.exe .\build\premake5.exe

      # Step 3: Generate Visual Studio 2022 project files with Premake
      - name: Generate VS2022 project files
        run: |
          cd build
          .\premake5.exe vs2022

      # Step 4: Build Release Configuration
      - name: Build Release Configuration
        run: |
          MSBuild.exe build/YourSolution.sln /p:Configuration=Release

      # Step 5: Build Debug Configuration
      - name: Build Debug Configuration
        run: |
          MSBuild.exe build/YourSolution.sln /p:Configuration=Debug

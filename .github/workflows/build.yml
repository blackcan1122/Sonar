name: Windows Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Install Premake5
      - name: Install Premake5
        run: |
          curl -LO https://github.com/premake/premake-core/releases/download/v5.0.0-alpha16/premake-5.0.0-alpha16-windows.zip
          tar -xf premake-5.0.0-alpha16-windows.zip
          move premake5.exe C:\Windows\System32

      # Step 3: Generate Visual Studio project files with Premake
      - name: Generate Visual Studio Project Files
        run: premake5 vs2022

      # Step 4: Build the solution using MSVC
      - name: Build Solution
        run: |
          msbuild build/Sonar.sln /p:Configuration=Release /m
